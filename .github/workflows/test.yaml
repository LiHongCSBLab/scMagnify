name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 5 1,15 * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.continue-on-error || false }}
    defaults:
      run:
        shell: bash -e {0} # -e to fail on error

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.10"
            pip-flags: "--pre"
            name: PRE-RELEASE DEPENDENCIES
            continue-on-error: true

    name: ${{ matrix.name }} Python ${{ matrix.python }}

    env:
      OS: ${{ matrix.os }}
      PYTHON: ${{ matrix.python }}

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: "pip"
          cache-dependency-path: "**/pyproject.toml"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip wheel

      - name: Install dependencies
        run: |
          pip install ${{ matrix.pip-flags }} ".[dev,test]"

      - name: Rebuild MOODS-python from source with safe CFLAGS
        run: |
          pip uninstall -y MOODS-python
          export CFLAGS="-mno-avx -mno-avx2 -mno-avx512"
          pip install --no-binary MOODS-python --no-cache-dir MOODS-python

      - name: Run pytest with coverage
        env:
          MPLBACKEND: agg
          PLATFORM: ${{ matrix.os }}
        run: |
          coverage run -m pytest -v --color=yes

      - name: Report coverage
        run: |
          coverage report
          coverage xml

      - name: Upload coverage
        if: ${{ !matrix.continue-on-error }}
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
